<!--
  Zombie Farm — Tile Lab
  ======================
  A bench for the art that has to meet edge to edge: both road sets, the pond pieces,
  rocks, the zombie patch. Lay pieces on the farm's own isometric lattice, drag one
  until its kerb lines up with its neighbour's, and copy out the anchor you just
  measured in the shape tools/prep_placeables.py ANCHOR_OVERRIDES takes.

  Why it exists: a flat tile does not sit bottom-centred on its footprint, it hangs off
  an authored cocos pivot (see flat_tile_fields / Field.flatTileOffset), and the source
  pivots are hand-rounded 2dp numbers that sometimes do not lay a piece where its
  neighbours are. Those cases have to be MEASURED, and measuring them by placing roads
  in the running game and squinting is how you end up 3px out.

  An anchor belongs to the ART, not to a placed copy: editing one moves every piece on
  the bench that draws the same tile, which is exactly the check you want.

    Place       click an empty tile with a palette piece armed
    Select      click a piece  ·  drag to move it a tile at a time
    Anchor      drag with Alt (or the Anchor mode button) to slide the ART
                arrows nudge 1 source px, Shift x10, Ctrl+arrows move a tile
    Delete      Del / Backspace  ·  Ctrl+Z undoes

  GENERATED by tools/build_tile_lab.py, which inlines the current art + anchors so the
  page works by double-clicking. Re-run it after an art or anchor change. The anchor
  rule itself is inlined from tools/tileAnchorGeometry.js, which
  src/tileLabGeometry.test.ts drives against Field's own — so this tool cannot quietly
  drift from the game it is measuring for.
-->
<meta charset="utf-8" />
<title>ZF Tile Lab</title>
<style>
  :root {
    --bg: #14171c; --panel: #1c2128; --panel2: #232a33; --line: #313a45;
    --ink: #e6edf3; --muted: #8b98a5; --accent: #58a6ff; --accent2: #3fb950;
    --danger: #f85149; --warn: #d29922; --cyan: #39c5cf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 250px 1fr 300px; height: 100vh; }
  .col { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .col.left { border-right: 1px solid var(--line); }
  .col.right { border-left: 1px solid var(--line); }
  .col.center { position: relative; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0; padding: 10px 12px 6px; }
  .pad { padding: 8px 12px; }
  .scroll { overflow-y: auto; flex: 1; }
  label { color: var(--muted); font-size: 11px; }
  select, input, button, textarea {
    font: inherit; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; }
  select, input[type=text], input[type=number] { width: 100%; }
  input[type=number] { -moz-appearance: textfield; }
  button { cursor: pointer; background: var(--panel2); }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #1f6feb33; border-color: var(--accent); }
  button.on { background: #1f6feb33; border-color: var(--accent); color: #cfe4ff; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  .mini { padding: 3px 6px; font-size: 11px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .field { margin-bottom: 6px; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .toolbar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line);
    align-items: center; flex-wrap: wrap; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .badge { position: absolute; right: 12px; top: 52px; background: #000a; padding: 6px 10px;
    border-radius: 6px; font-size: 11px; pointer-events: none; font-family: ui-monospace, monospace; }
  .overlay-tip { position: absolute; left: 12px; bottom: 12px; background: #000a; padding: 6px 10px;
    border-radius: 6px; color: var(--muted); font-size: 11px; pointer-events: none; max-width: 70%; }
  .overlay-tip kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
    padding: 0 4px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink); }
  .piece { display: flex; gap: 8px; align-items: center; padding: 5px 10px; cursor: pointer;
    border-bottom: 1px solid var(--line); }
  .piece:hover { background: #ffffff08; }
  .piece.sel { background: #1f6feb26; box-shadow: inset 2px 0 0 var(--accent); }
  .piece .thumb { width: 34px; height: 22px; flex: none; object-fit: contain; image-rendering: pixelated; }
  .piece .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .piece .sub { color: var(--muted); font-size: 10px; font-family: ui-monospace, monospace; }
  .piece .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .laid { display: flex; gap: 6px; align-items: center; padding: 3px 10px; cursor: pointer;
    border-bottom: 1px solid var(--line); font-size: 11px; }
  .laid:hover { background: #ffffff08; }
  .laid.sel { background: #1f6feb26; box-shadow: inset 2px 0 0 var(--accent); }
  .laid .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .laid .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .laid .at { color: var(--muted); font-family: ui-monospace, monospace; font-size: 10px; }
  .hint { color: var(--muted); font-size: 11px; }
  .num { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
  .num label { width: 54px; flex: none; }
  .num input[type=number] { width: 78px; padding: 3px 5px; }
  .num .px { color: var(--muted); font-size: 10px; font-family: ui-monospace, monospace; min-width: 66px; }
  .delta { color: var(--warn); font-family: ui-monospace, monospace; font-size: 10px; }
  textarea { width: 100%; resize: none; font-family: ui-monospace, "Cascadia Code", monospace;
    font-size: 11px; white-space: pre; }
  #export { flex: 1; min-height: 120px; }
  .grp { font-size: 10px; color: var(--muted); padding: 6px 10px 2px; text-transform: uppercase;
    letter-spacing: .06em; background: var(--panel); }
</style>

<div id="app">
  <!-- LEFT: what you can lay, and what you have laid -->
  <div class="col left">
    <div class="toolbar" style="justify-content:space-between">
      <strong style="font-size:12px">🧱 Tile Lab</strong>
      <span class="hint" id="armed">nothing armed</span>
    </div>
    <div class="pad" style="padding-bottom:4px">
      <input type="text" id="filter" placeholder="filter pieces…" />
    </div>
    <div class="scroll" id="palette"></div>
    <h2>On the bench</h2>
    <div class="scroll" id="laidList" style="max-height:32vh"></div>
    <div class="pad row">
      <button class="mini" id="btnClear">Clear bench</button>
      <button class="mini" id="btnStore" title="Keep this bench and these anchors in the browser">💾</button>
    </div>
  </div>

  <!-- CENTER -->
  <div class="col center">
    <div class="toolbar">
      <button class="mini" id="mPlace" data-mode="place">Place</button>
      <button class="mini" id="mSelect" data-mode="select">Select</button>
      <button class="mini" id="mAnchor" data-mode="anchor" title="Drag a piece's ART; the footprint stays put (Alt does this in any mode)">Anchor</button>
      <div class="sep"></div>
      <button class="mini" id="btnUndo" title="Ctrl+Z">↶</button>
      <button class="mini" id="btnRedo" title="Ctrl+Y">↷</button>
      <div class="sep"></div>
      <label class="toggle">Zoom <input type="range" id="zoom" min="1" max="12" step="1" value="3" style="width:90px"></label>
      <button class="mini" id="btnFit">Fit</button>

  <!-- RIGHT: the piece under the cursor, and the anchor it draws by -->
  <div class="col right">
    <h2>Selected piece</h2>
    <div class="pad" id="inspector"><div class="hint">Nothing selected.</div></div>
    <h2>Presets</h2>
    <div class="pad">
      <div class="row" style="margin-bottom:6px">
        <select id="family" style="flex:1"></select>
      </div>
      <div class="row" style="flex-wrap:wrap" id="presetRow"></div>
      <div class="hint" style="margin-top:6px">Drops by the selected piece, or on the tile
        under the pointer. Everything a preset lays is a real piece — move it, turn it, or
        drag its art like any other.</div>
    </div>
    <h2 style="display:flex;justify-content:space-between;align-items:center">
      <span>Measured anchors</span>
      <span>
        <button class="mini primary" id="btnCopyPy" title="ANCHOR_OVERRIDES block for tools/prep_placeables.py">Copy Python</button>
        <button class="mini" id="btnSave" title="Save these anchors as a .json file to send back">⬇ Save</button>
        <button class="mini" id="btnLoad" title="Load someone else's anchors.json onto this bench">⬆ Load</button>

    </h2>
    <textarea id="export" spellcheck="false" readonly></textarea>
  </div>
</div>

<script>
window.__BOOT__ = window.__BOOT__ || __BOOT_JSON__;
(() => {
  "use strict";

  // ---- the farm's own anchor rule, inlined from tools/tileAnchorGeometry.js -----
  /* __GEOMETRY__ */

  const $ = (s) => document.querySelector(s);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const boot = window.__BOOT__ || { pieces: [], sprites: {} };

  // ---- state -------------------------------------------------------------------
  // `edits` is keyed by TILE, not by placed piece: an anchor belongs to the art, so
  // every copy on the bench moves together — which is the whole point of laying two
  // of them next to each other.
  let placed = [];        // {id, key, vi, oc, or, flipped}
  let edits = {};         // tile -> {anchorX?, anchorY?, dc?, dr?}
  let sel = null;         // placed id
  let armed = null;       // {key, vi} from the palette
  let mode = "place";
  let nextId = 1;
  const view = { ox: 0, oy: 0, zoom: 3 };
  const undoStack = [], redoStack = [];

  const pieces = boot.pieces;
  const byKey = new Map(pieces.map((p) => [p.key, p]));
  const images = {}, baked = {}, tinted = {};

  const canvas = $("#stage"), ctx = canvas.getContext("2d");

  // ---- art lookup --------------------------------------------------------------
  const variantOf = (o) => byKey.get(o.key).variants[o.vi];
  /** The art a piece draws right now: what shipped, with any measured edit on top. */
  function artOf(o) {
    const v = variantOf(o);
    const e = edits[v.tile] || {};
    return {
      nativeW: v.nativeW, nativeH: v.nativeH,
      anchorX: e.anchorX !== undefined ? e.anchorX : v.anchorX,
      anchorY: e.anchorY !== undefined ? e.anchorY : v.anchorY,
      dc: e.dc !== undefined ? e.dc : (v.dc || 0),
      dr: e.dr !== undefined ? e.dr : (v.dr || 0),
      tile: v.tile, sprite: v.sprite,
    };
  }
  const shippedArt = (o) => {
    const v = variantOf(o);
    return { nativeW: v.nativeW, nativeH: v.nativeH, anchorX: v.anchorX, anchorY: v.anchorY,
      dc: v.dc || 0, dr: v.dr || 0 };
  };
  const rectOf = (o, art) => {
    const p = byKey.get(o.key);
    return artRect(art || artOf(o), p.tileW, p.tileH, o.oc, o.or, o.flipped);
  };
  const footOf = (o) => {
    const p = byKey.get(o.key);
    return objectFootprint(p.tileW, p.tileH, o.flipped);
  };
  const edited = (tile) => {
    const e = edits[tile];
    return !!e && Object.keys(e).length > 0;
  };

  // ---- undo --------------------------------------------------------------------
  const snapshot = () => ({ placed: clone(placed), edits: clone(edits), sel });
  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
  }
  function restore(s) { placed = clone(s.placed); edits = clone(s.edits); sel = s.sel; }
  function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); after(); }
  function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); after(); }

  // ---- image loading -----------------------------------------------------------
  function bake(sprite) {
    const img = images[sprite];
    if (!img || !img.complete || !img.naturalWidth) return null;
    if (!baked[sprite]) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const cx = c.getContext("2d", { willReadFrequently: true });
      cx.drawImage(img, 0, 0);
      baked[sprite] = { c, cx, data: cx.getImageData(0, 0, c.width, c.height).data };
    }
    return baked[sprite];
  }
  /** A hue-washed copy, so you can see which pixels came from which piece. */
  function tintOf(sprite, hue) {
    const key = sprite + "|" + hue;
    if (tinted[key]) return tinted[key];
    const b = bake(sprite);
    if (!b) return null;
    const c = document.createElement("canvas");
    c.width = b.c.width; c.height = b.c.height;
    const cx = c.getContext("2d");
    cx.drawImage(b.c, 0, 0);
    cx.globalCompositeOperation = "source-atop";
    cx.fillStyle = `hsla(${hue}, 90%, 55%, .42)`;
    cx.fillRect(0, 0, c.width, c.height);
    tinted[key] = c;
    return c;
  }
  const hueOf = (o) => (placed.findIndex((q) => q.id === o.id) * 67) % 360;

  function loadImages(done) {
    const names = Object.keys(boot.sprites);
    let left = names.length;
    if (!left) return done();
    names.forEach((n) => {
      const img = new Image();
      img.onload = img.onerror = () => { if (--left === 0) done(); };
      img.src = boot.sprites[n];
      images[n] = img;
    });
  }

  // ---- view --------------------------------------------------------------------
  const w2s = (x, y) => [view.ox + x * view.zoom, view.oy + y * view.zoom];
  const s2w = (sx, sy) => [(sx - view.ox) / view.zoom, (sy - view.oy) / view.zoom];
  /** Screen point -> the tile whose diamond contains it. gridToScreen puts (col,row)
   *  at that tile's TOP point, so the plain inverse floors straight into the tile. */
  function tileAt(sx, sy) {
    const [x, y] = s2w(sx, sy);
    return { col: Math.floor((x / HW + y / HH) / 2), row: Math.floor((y / HH - x / HW) / 2) };
  }
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round((r.height - 41) * dpr);
    canvas.style.height = (r.height - 41) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  const cssSize = () => {
    const dpr = window.devicePixelRatio || 1;
    return [canvas.width / dpr, canvas.height / dpr];
  };
  function fitView() {
    const [cw, ch] = cssSize();
    if (!placed.length) {
      view.ox = cw / 2; view.oy = ch / 2 - 60 * view.zoom;
      return draw();
    }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    placed.forEach((o) => {
      const r = rectOf(o);
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top);
      x1 = Math.max(x1, r.left + r.w); y1 = Math.max(y1, r.top + r.h);
    });
    const pad = 30;
    const z = Math.max(1, Math.min(12, Math.floor(Math.min((cw - pad) / (x1 - x0), (ch - pad) / (y1 - y0)))));
    view.zoom = z;
    $("#zoom").value = z;
    view.ox = cw / 2 - ((x0 + x1) / 2) * z;
    view.oy = ch / 2 - ((y0 + y1) / 2) * z;
    draw();
  }

  // ---- drawing -----------------------------------------------------------------
  let hover = null;
  const cursor = { x: 0, y: 0 }; // world px under the pointer, for the badge readout

  function drawGrid() {
    const [cw, ch] = cssSize();
    const corners = [s2w(0, 0), s2w(cw, 0), s2w(0, ch), s2w(cw, ch)];
    let c0 = 1e9, c1 = -1e9, r0 = 1e9, r1 = -1e9;
    corners.forEach(([x, y]) => {
      const c = (x / HW + y / HH) / 2, r = (y / HH - x / HW) / 2;
      c0 = Math.min(c0, c); c1 = Math.max(c1, c); r0 = Math.min(r0, r); r1 = Math.max(r1, r);
    });
    c0 = Math.floor(c0) - 1; c1 = Math.ceil(c1) + 1;
    r0 = Math.floor(r0) - 1; r1 = Math.ceil(r1) + 1;
    if ((c1 - c0) * (r1 - r0) > 40000) return; // zoomed way out: not worth the lines
    ctx.lineWidth = 1;
    for (let c = c0; c <= c1; c++) {
      const a = gridToScreen(c, r0), b = gridToScreen(c, r1);
      ctx.strokeStyle = c % 4 === 0 ? "#3a4552" : "#252d36";
      ctx.beginPath(); ctx.moveTo(...w2s(a.x, a.y)); ctx.lineTo(...w2s(b.x, b.y)); ctx.stroke();
    }
    for (let r = r0; r <= r1; r++) {
      const a = gridToScreen(c0, r), b = gridToScreen(c1, r);
      ctx.strokeStyle = r % 4 === 0 ? "#3a4552" : "#252d36";
      ctx.beginPath(); ctx.moveTo(...w2s(a.x, a.y)); ctx.lineTo(...w2s(b.x, b.y)); ctx.stroke();
    }
  }

  /** Outline a block of tiles (a footprint, or one hovered tile). */
  function tileOutline(oc, or, w, h, stroke, fill) {
    const n = gridToScreen(oc, or), e = gridToScreen(oc + w, or);
    const s = gridToScreen(oc + w, or + h), wst = gridToScreen(oc, or + h);
    ctx.beginPath();
    ctx.moveTo(...w2s(n.x, n.y)); ctx.lineTo(...w2s(e.x, e.y));
    ctx.lineTo(...w2s(s.x, s.y)); ctx.lineTo(...w2s(wst.x, wst.y));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
  }

  function drawPiece(o, art, alpha, useTint) {
    const b = bake(art.sprite || variantOf(o).sprite);
    if (!b) return;
    const r = rectOf(o, art);
    const [sx, sy] = w2s(r.left, r.top);
    const dw = r.w * view.zoom, dh = r.h * view.zoom;
    const src = useTint ? (tintOf(art.sprite || variantOf(o).sprite, hueOf(o)) || b.c) : b.c;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.imageSmoothingEnabled = false;
    if (o.flipped) {
      ctx.translate(Math.round(sx) + Math.round(dw), Math.round(sy));
      ctx.scale(-1, 1);
      ctx.drawImage(src, 0, 0, Math.round(dw), Math.round(dh));
    } else {
      ctx.drawImage(src, Math.round(sx), Math.round(sy), Math.round(dw), Math.round(dh));
    }
    ctx.restore();
  }

  /** The two points the rule is about: the ground tile the art hangs from (cyan), and
   *  the pixel of the art pinned to it (amber). They coincide when the piece is drawn
   *  by its own anchor, which is always — what the overlay is for is showing WHICH
   *  tile corner a piece hangs from, the thing `dc`/`dr` move. */
  function drawPins(o) {
    const art = artOf(o), fp = footOf(o);
    if (art.anchorX === undefined) return; // bottom-centred art hangs off nothing
    const front = gridToScreen(o.oc + fp.w - 1 + art.dc, o.or + fp.h - 1 + art.dr);
    const ground = [front.x - HW, front.y + TILE_H];
    const r = rectOf(o, art);
    // A mirrored piece is pinned by the reflected anchor (`1 - pivotx - 48/w`), and
    // the drawn art is measured from its own left edge either way round.
    const eff = o.flipped
      ? 1 - art.anchorX - SOURCE_TILE_W / art.nativeW
      : art.anchorX;
    const ax = r.left + eff * art.nativeW * SCALE;
    const ay = r.top + r.h - art.anchorY * art.nativeH * SCALE;
    const [gx, gy] = w2s(ground[0], ground[1]);
    ctx.strokeStyle = "#39c5cf"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(gx, gy, 5, 0, 7); ctx.stroke();
    const [px, py] = w2s(ax, ay);
    ctx.strokeStyle = "#d29922";
    ctx.beginPath();
    ctx.moveTo(px - 6, py); ctx.lineTo(px + 6, py);
    ctx.moveTo(px, py - 6); ctx.lineTo(px, py + 6);
    ctx.stroke();
  }

  function draw() {
    const [cw, ch] = cssSize();
    ctx.fillStyle = "#1a1f26";
    ctx.fillRect(0, 0, cw, ch);
    if ($("#ckGrid").checked) drawGrid();
    if (hover && mode === "place" && armed) {
      tileOutline(hover.col, hover.row, 1, 1, "#3fb95088", "#3fb95022");
    }
    // Painter's order, same key the farm sorts its ground objects by: the piece whose
    // front tile is further south draws later.
    const order = placed.slice().sort((a, b) => {
      const fa = footOf(a), fb = footOf(b);
      return (a.oc + fa.w - 1 + a.or + fa.h - 1) - (b.oc + fb.w - 1 + b.or + fb.h - 1);
    });
    const tint = $("#ckTint").checked, ghost = $("#ckGhost").checked;
    order.forEach((o) => {
      const art = artOf(o);
      if (ghost && edited(art.tile)) drawPiece(o, shippedArt(o), 0.22, false);
      drawPiece(o, art, 1, tint);
    });
    if ($("#ckFoot").checked) {
      order.forEach((o) => {
        const fp = footOf(o);
        tileOutline(o.oc, o.or, fp.w, fp.h, o.id === sel ? "#58a6ff" : "#ffffff22", null);
      });
    }
    if ($("#ckPins").checked) order.forEach(drawPins);
    const s = placed.find((o) => o.id === sel);
    if (s) {
      const r = rectOf(s);
      const [x, y] = w2s(r.left, r.top);
      ctx.strokeStyle = "#58a6ff"; ctx.setLineDash([4, 3]); ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(x) + .5, Math.round(y) + .5, Math.round(r.w * view.zoom), Math.round(r.h * view.zoom));
      ctx.setLineDash([]);
    }
    // The cursor's world position in SOURCE pixels — the unit anchors are authored
    // in, so a kerb that steps can be read off by hovering both sides of the seam.
    const at = hover ? `tile ${hover.col},${hover.row}   ${(cursor.x / SCALE).toFixed(1)}, ${(cursor.y / SCALE).toFixed(1)} px` : "";
    $("#badge").textContent = `${at}   zoom ${view.zoom}x`;
  }

  // ---- picking -----------------------------------------------------------------
  /** Topmost piece whose ART covers this point (falling back to its footprint, so a
   *  piece is still selectable by the tiles it claims). */
  function pick(sx, sy) {
    const order = placed.slice().sort((a, b) => {
      const fa = footOf(a), fb = footOf(b);
      return (b.oc + fb.w - 1 + b.or + fb.h - 1) - (a.oc + fa.w - 1 + a.or + fa.h - 1);
    });
    const [wx, wy] = s2w(sx, sy);
    for (const o of order) {
      const art = artOf(o), r = rectOf(o, art), b = bake(art.sprite);
      if (wx < r.left || wy < r.top || wx > r.left + r.w || wy > r.top + r.h) continue;
      if (!b) return o;
      let px = Math.floor((wx - r.left) / SCALE);
      const py = Math.floor((wy - r.top) / SCALE);
      if (o.flipped) px = art.nativeW - 1 - px;
      if (px < 0 || py < 0 || px >= art.nativeW || py >= art.nativeH) continue;
      if (b.data[(py * art.nativeW + px) * 4 + 3] > 24) return o;
    }
    const t = tileAt(sx, sy);
    return placed.find((o) => {
      const fp = footOf(o);
      return t.col >= o.oc && t.col < o.oc + fp.w && t.row >= o.or && t.row < o.or + fp.h;
    }) || null;
  }

  // ---- anchor editing ----------------------------------------------------------
  /** Slide a piece's ART by (dx,dy) world px, as a change to the anchor it hangs off.
   *
   *  dx = ... + w*(0.5 - anchorX_eff), and a mirrored piece takes its anchor through
   *  `1 - anchorX - 48/w`, so the drag inverts with the flip. dy = h*anchorY.  */
  function slideArt(o, dx, dy) {
    const art = artOf(o), v = variantOf(o);
    if (art.anchorX === undefined) return; // bottom-centred art has no anchor to move
    const w = art.nativeW * SCALE, h = art.nativeH * SCALE;
    let ax = art.anchorX + (o.flipped ? dx / w : -dx / w);
    let ay = art.anchorY + dy / h;
    if ($("#ckSnap").checked) {
      ax = Math.round(ax * art.nativeW) / art.nativeW;
      ay = Math.round(ay * art.nativeH) / art.nativeH;
    }
    setEdit(v.tile, { anchorX: +ax.toFixed(6), anchorY: +ay.toFixed(6) });
  }
  function setEdit(tile, patch) {
    const e = Object.assign({}, edits[tile] || {}, patch);
    const v = pieces.flatMap((p) => p.variants).find((x) => x.tile === tile);
    // Drop a key that has come back to the shipped value, so "edited" stays honest.
    ["anchorX", "anchorY"].forEach((k) => { if (v && e[k] === v[k]) delete e[k]; });
    ["dc", "dr"].forEach((k) => { if (e[k] === (v ? (v[k] || 0) : 0)) delete e[k]; });
    if (Object.keys(e).length) edits[tile] = e; else delete edits[tile];
  }
  function revertTile(tile) { pushUndo(); delete edits[tile]; after(); }

  // ---- interaction -------------------------------------------------------------
  let drag = null;

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    // A pointer that was never really down (a synthetic event, a driver) cannot be
    // captured; that is not a reason to drop the click.
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* not a real pointer */ }
    if (e.button === 1 || e.button === 2 || e.shiftKey) {          // pan
      drag = { kind: "pan", sx, sy, ox: view.ox, oy: view.oy };
      return;
    }
    const hit = pick(sx, sy);
    if (mode === "place" && armed && !hit) {
      const t = tileAt(sx, sy);
      pushUndo();
      const p = byKey.get(armed.key);
      const v = p.variants[armed.vi];
      placed.push({ id: nextId++, key: armed.key, vi: armed.vi, oc: t.col, or: t.row,
        flipped: !!v.flip });
      sel = placed[placed.length - 1].id;
      return after();
    }
    if (!hit) { sel = null; drag = { kind: "pan", sx, sy, ox: view.ox, oy: view.oy }; return after(); }
    sel = hit.id;
    const anchorDrag = mode === "anchor" || e.altKey;
    const [wx, wy] = s2w(sx, sy);
    drag = anchorDrag
      ? { kind: "anchor", id: hit.id, wx, wy, moved: false }
      : { kind: "move", id: hit.id, tile: tileAt(sx, sy), oc: hit.oc, or: hit.or, moved: false };
    after();
  });

  canvas.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    hover = tileAt(sx, sy);
    [cursor.x, cursor.y] = s2w(sx, sy);
    if (!drag) return draw();
    if (drag.kind === "pan") {
      view.ox = drag.ox + (sx - drag.sx);
      view.oy = drag.oy + (sy - drag.sy);
      return draw();
    }
    const o = placed.find((q) => q.id === drag.id);
    if (!o) return;
    if (drag.kind === "move") {
      const t = tileAt(sx, sy);
      const oc = drag.oc + (t.col - drag.tile.col), or = drag.or + (t.row - drag.tile.row);
      if (oc === o.oc && or === o.or) return draw();
      if (!drag.moved) { pushUndo(); drag.moved = true; }
      o.oc = oc; o.or = or;
      return after();
    }
    if (drag.kind === "anchor") {
      const [wx, wy] = s2w(sx, sy);
      if (!drag.moved) { pushUndo(); drag.moved = true; }
      slideArt(o, wx - drag.wx, wy - drag.wy);
      drag.wx = wx; drag.wy = wy;
      return after();
    }
  });

  const endDrag = () => { drag = null; };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const [wx, wy] = s2w(sx, sy);
    const z = Math.max(1, Math.min(12, view.zoom + (e.deltaY < 0 ? 1 : -1)));
    view.zoom = z;
    $("#zoom").value = z;
    view.ox = sx - wx * z;
    view.oy = sy - wy * z;
    draw();
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t && t.matches && t.matches("input, textarea, select")) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
    if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); return redo(); }
    const o = placed.find((q) => q.id === sel);
    if ((e.key === "Delete" || e.key === "Backspace") && o) {
      e.preventDefault(); pushUndo();
      placed = placed.filter((q) => q.id !== o.id); sel = null;
      return after();
    }
    if (k === "f" && o) { e.preventDefault(); pushUndo(); o.flipped = !o.flipped; return after(); }
    const arrows = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] };
    if (arrows[k] && o) {
      e.preventDefault();
      const [ax, ay] = arrows[k];
      pushUndo();
      if (e.ctrlKey || e.metaKey) {          // move a whole tile along the grid axes
        o.oc += ax; o.or += ay;
      } else {                                // nudge the art by source pixels
        const n = e.shiftKey ? 10 : 1;
        slideArt(o, ax * n * SCALE, ay * n * SCALE);
      }
      return after();
    }
  });

  // ---- palette -----------------------------------------------------------------
  // The art that has to meet edge to edge comes first: it is what the bench is for.
  // "Standing objects" only exists in a --all build, and only to check what a road
  // runs past.
  const GROUP_ORDER = ["Asphalt road", "Stone road", "Pond", "Other flat art", "Standing objects"];
  const groupOf = (p) => (!p.flat ? "Standing objects"
    : /^cobblestone/.test(p.key) ? "Stone road"
      : /^road/.test(p.key) ? "Asphalt road"
        : /^pond/.test(p.key) ? "Pond" : "Other flat art");

  function rebuildPalette() {
    const host = $("#palette");
    host.innerHTML = "";
    const q = $("#filter").value.trim().toLowerCase();
    const groups = new Map(GROUP_ORDER.map((g) => [g, []]));
    pieces.forEach((p) => {
      if (q && !(p.name + " " + p.key).toLowerCase().includes(q)
        && !p.variants.some((v) => v.tile.toLowerCase().includes(q))) return;
      groups.get(groupOf(p)).push(p);
    });
    groups.forEach((list, g) => {
      if (!list.length) return;
      const h = document.createElement("div");
      h.className = "grp"; h.textContent = g;
      host.appendChild(h);
      list.forEach((p) => p.variants.forEach((v, vi) => {
        const row = document.createElement("div");
        row.className = "piece" + (armed && armed.key === p.key && armed.vi === vi ? " sel" : "");
        const img = document.createElement("img");
        img.className = "thumb"; img.src = boot.sprites[v.sprite];
        const nm = document.createElement("div");
        nm.className = "nm";
        nm.innerHTML = `${p.name}${p.variants.length > 1 ? ` <span class="sub">#${vi}</span>` : ""}`
          + `<div class="sub">${v.tile}${v.flip ? " · mirrored" : ""} · ${p.tileW}x${p.tileH}</div>`;
        row.appendChild(img); row.appendChild(nm);
        if (edited(v.tile)) { const d = document.createElement("div"); d.className = "dot"; row.appendChild(d); }
        row.addEventListener("click", () => {
          armed = { key: p.key, vi };
          // Follow the piece into its family, so the presets on offer are the ones
          // that make sense for what you just picked up.
          const f = famOf(p.key);
          if (f) { family = f; $("#family").value = f; rebuildPresets(); }
          mode = "place"; syncModeButtons();
          $("#armed").textContent = `${p.name} #${vi}`;
          rebuildPalette();
        });
        host.appendChild(row);
      }));
    });
  }

  function rebuildLaid() {
    const host = $("#laidList");
    host.innerHTML = "";
    placed.forEach((o) => {
      const p = byKey.get(o.key), v = variantOf(o);
      const row = document.createElement("div");
      row.className = "laid" + (o.id === sel ? " sel" : "");
      const sw = document.createElement("div");
      sw.className = "sw"; sw.style.background = `hsl(${hueOf(o)},80%,55%)`;
      const nm = document.createElement("div");
      nm.className = "nm"; nm.textContent = `${p.name}${p.variants.length > 1 ? " #" + o.vi : ""}`;
      const at = document.createElement("div");
      at.className = "at"; at.textContent = `${o.oc},${o.or}${o.flipped ? " ⇋" : ""}`;
      row.appendChild(sw); row.appendChild(nm); row.appendChild(at);
      row.addEventListener("click", () => { sel = o.id; after(); });
      host.appendChild(row);
    });
    if (!placed.length) host.innerHTML = '<div class="pad hint">Arm a piece and click a tile.</div>';
  }

  // ---- inspector ---------------------------------------------------------------
  function numRow(host, label, value, step, px, onInput) {
    const row = document.createElement("div");
    row.className = "num";
    const l = document.createElement("label"); l.textContent = label;
    const i = document.createElement("input");
    i.type = "number"; i.step = step; i.value = value;
    i.addEventListener("change", () => { pushUndo(); onInput(parseFloat(i.value)); after(); });
    const s = document.createElement("span");
    s.className = "px"; s.textContent = px || "";
    row.appendChild(l); row.appendChild(i); row.appendChild(s);
    host.appendChild(row);
  }

  function rebuildInspector() {
    const host = $("#inspector");
    host.innerHTML = "";
    const o = placed.find((q) => q.id === sel);
    if (!o) { host.innerHTML = '<div class="hint">Nothing selected.</div>'; return; }
    const p = byKey.get(o.key), v = variantOf(o), art = artOf(o);
    const head = document.createElement("div");
    head.innerHTML = `<strong>${p.name}</strong> <span class="hint">${p.tileW}x${p.tileH}</span>`
      + `<div class="hint" style="font-family:ui-monospace,monospace">${v.tile} · ${art.nativeW}x${art.nativeH}px</div>`;
    host.appendChild(head);

    const pos = document.createElement("div");
    pos.style.margin = "8px 0 4px";
    pos.innerHTML = '<label>Footprint origin</label>';
    host.appendChild(pos);
    numRow(host, "col", o.oc, 1, "", (n) => { o.oc = Math.round(n); });
    numRow(host, "row", o.or, 1, "", (n) => { o.or = Math.round(n); });

    const flip = document.createElement("button");
    flip.className = "mini"; flip.textContent = o.flipped ? "Mirrored (F)" : "Not mirrored (F)";
    if (o.flipped) flip.classList.add("on");
    flip.addEventListener("click", () => { pushUndo(); o.flipped = !o.flipped; after(); });
    host.appendChild(flip);

    if (art.anchorX === undefined) {
      const n = document.createElement("div");
      n.className = "hint"; n.style.marginTop = "10px";
      n.textContent = "This art is bottom-centred on its footprint — it has no authored anchor to measure.";
      host.appendChild(n);
      return;
    }

    const ah = document.createElement("div");
    ah.style.margin = "10px 0 4px";
    ah.innerHTML = `<label>Anchor — shared by every <code>${v.tile}</code> on the bench</label>`;
    host.appendChild(ah);
    const dxPx = (art.anchorX - v.anchorX) * art.nativeW, dyPx = (art.anchorY - v.anchorY) * art.nativeH;
    numRow(host, "anchorX", art.anchorX, 0.001,
      `${(art.anchorX * art.nativeW).toFixed(1)}px from left`,
      (n) => setEdit(v.tile, { anchorX: +n.toFixed(6) }));
    numRow(host, "anchorY", art.anchorY, 0.001,
      `${(art.anchorY * art.nativeH).toFixed(1)}px up`,
      (n) => setEdit(v.tile, { anchorY: +n.toFixed(6) }));
    numRow(host, "hang dc", art.dc, 1, "tiles", (n) => setEdit(v.tile, { dc: Math.round(n) }));
    numRow(host, "hang dr", art.dr, 1, "tiles", (n) => setEdit(v.tile, { dr: Math.round(n) }));

    if (edited(v.tile)) {
      const d = document.createElement("div");
      d.className = "delta";
      d.textContent = `moved ${dxPx >= 0 ? "+" : ""}${dxPx.toFixed(2)}px x, `
        + `${dyPx >= 0 ? "+" : ""}${dyPx.toFixed(2)}px y  (shipped ${v.anchorX}, ${v.anchorY})`;
      host.appendChild(d);
      const rev = document.createElement("button");
      rev.className = "mini danger"; rev.style.marginTop = "6px";
      rev.textContent = "Revert to shipped";
      rev.addEventListener("click", () => revertTile(v.tile));
      host.appendChild(rev);
    }

    const r = rectOf(o, art);
    const rr = document.createElement("div");
    rr.className = "hint";
    rr.style.marginTop = "8px";
    rr.style.fontFamily = "ui-monospace,monospace";
    rr.textContent = `art x ${r.left.toFixed(2)}..${(r.left + r.w).toFixed(2)}  `
      + `bottom ${r.by.toFixed(2)}`;
    host.appendChild(rr);
  }

  // ---- presets -----------------------------------------------------------------
  // Layouts worth dropping whole, because what you are judging is how pieces MEET, and
  // a seam needs both sides of it.
  //
  // Two facts the road presets are built on, both measured rather than assumed:
  //   - which orientation of a family's straight runs along the col axis (down-right on
  //     screen). The asphalt straight is authored that way; the stone one is authored
  //     along the row axis and mirrors to run the other.
  //   - which two arms each bend corner has. Turning a bend swaps its ART rather than
  //     mirroring one sprite (see ROAD_TURNS), and the four corners come in a fixed
  //     order, pinned by src/Field.flatTile.test.ts.
  const FAMILIES = {
    asphalt: {
      label: "Asphalt road", straight: "roadStraight", bend: "roadBend_01",
      cross: "roadIntersection", straightFlipForCol: false,
    },
    stone: {
      label: "Stone path", straight: "cobblestoneRoadStraight_01", bend: "cobblestoneRoadBend_01",
      cross: "cobblestoneRoadIntersection", straightFlipForCol: true,
    },
    pond: { label: "Pond", pond: true },
  };
  /** The arms of each bend corner, in turn order. E = +col, W = -col, S = +row,
   *  N = -row. */
  const CORNER_ARMS = [["E", "S"], ["W", "N"], ["E", "N"], ["W", "S"]];

  /** A 3x3 pond: the fill in the middle and each rim on the side its own art puts it.
   *  Classified from the art — which side of the piece the water sits on — rather than
   *  guessed. The two edges the source never drew are the N and S pieces MIRRORED,
   *  which in iso swaps the col and row axes and so turns a N rim into a W one. */
  const POND_PLAN = [
    { dc: -1, dr: -1, key: "pond1" },                // NW corner
    { dc: 0, dr: -1, key: "pond4" },                 // N edge
    { dc: 1, dr: -1, key: "pond3" },                 // NE corner
    { dc: -1, dr: 0, key: "pond4", flipped: true },  // W edge = the N piece turned
    { dc: 0, dr: 0, key: "pond7" },                  // the fill
    { dc: 1, dr: 0, key: "pond5", flipped: true },   // E edge = the S piece turned
    { dc: -1, dr: 1, key: "pond6" },                 // SW corner
    { dc: 0, dr: 1, key: "pond5" },                  // S edge
    { dc: 1, dr: 1, key: "pond2" },                  // SE corner
  ];

  let family = "asphalt";
  const fam = () => FAMILIES[family];
  const famOf = (key) => (/^cobblestone/.test(key) ? "stone"
    : /^road/.test(key) ? "asphalt" : /^pond/.test(key) ? "pond" : null);

  /** Where a preset lands: by the selected piece if there is one, else under the
   *  pointer, else the origin. */
  function dropOrigin() {
    const o = placed.find((q) => q.id === sel);
    if (o) return { oc: o.oc, or: o.or };
    if (hover) return { oc: hover.col, or: hover.row };
    return { oc: 0, or: 0 };
  }

  const lay = (out, key, vi, oc, or, flipped) => {
    if (!byKey.has(key)) return;
    out.push({ id: nextId++, key, vi: vi || 0, oc, or, flipped: !!flipped });
  };
  /** One straight of the current family, laid along a grid axis. */
  const layStraight = (out, axis, oc, or) => {
    const f = fam();
    lay(out, f.straight, 0, oc, or, axis === "col" ? f.straightFlipForCol : !f.straightFlipForCol);
  };
  /** The straight that continues one arm of a piece sitting at (oc,or). */
  function layArm(out, arm, oc, or, span) {
    const at = { E: [oc + span, or], W: [oc - span, or], S: [oc, or + span], N: [oc, or - span] }[arm];
    layStraight(out, arm === "E" || arm === "W" ? "col" : "row", at[0], at[1]);
  }
  const bendFlip = (t) => !!byKey.get(fam().bend).variants[t].flip;

  const PRESETS = [
    {
      id: "run", label: "Run",
      hint: "Four straights in a line each way — the seam a road spends most of its length on",
      build(o) {
        const out = [];
        for (let i = 0; i < 4; i++) layStraight(out, "col", o.oc + i * 2, o.or);
        for (let i = 1; i < 4; i++) layStraight(out, "row", o.oc, o.or + i * 2);
        return out;
      },
    },
    {
      id: "corner", label: "Corner",
      hint: "A bend with a straight on each of its two arms. Select one corner for just that one, otherwise all four in a row",
      build(o) {
        const out = [];
        const p = placed.find((q) => q.id === sel);
        const one = p && famOf(p.key) === family && byKey.get(p.key).variants.length === 4;
        const turns = one ? [p.vi] : [0, 1, 2, 3];
        turns.forEach((t, i) => {
          const oc = o.oc + i * 8;
          if (!one) lay(out, fam().bend, t, oc, o.or, bendFlip(t));
          CORNER_ARMS[t].forEach((arm) => layArm(out, arm, oc, o.or, 2));
        });
        return out;
      },
    },
    {
      id: "cross", label: "Crossroads",
      hint: "The intersection with all four arms fed",
      build(o) {
        const out = [];
        lay(out, fam().cross, 0, o.oc, o.or, false);
        ["E", "W", "N", "S"].forEach((arm) => layArm(out, arm, o.oc, o.or, 2));
        return out;
      },
    },
    {
      id: "loop", label: "Closed loop",
      hint: "All four corners and the runs between them — a road that closes only if every corner meets its straights",
      build(o) {
        const out = [];
        [[0, 0, 0], [6, 0, 3], [0, 6, 2], [6, 6, 1]].forEach(([dc, dr, t]) =>
          lay(out, fam().bend, t, o.oc + dc, o.or + dr, bendFlip(t)));
        [2, 4].forEach((d) => {
          layStraight(out, "col", o.oc + d, o.or);
          layStraight(out, "col", o.oc + d, o.or + 6);
          layStraight(out, "row", o.oc, o.or + d);
          layStraight(out, "row", o.oc + 6, o.or + d);
        });
        return out;
      },
    },
    {
      id: "pond", label: "Pond 3x3", pond: true,
      hint: "The fill ringed by all six rims, with the two edges the source never drew supplied by mirroring",
      build(o) {
        const out = [];
        POND_PLAN.forEach((c) => lay(out, c.key, 0, o.oc + c.dc * 3, o.or + c.dr * 3, c.flipped));
        return out;
      },
    },
    {
      id: "shore", label: "Pond + road", pond: true,
      hint: "A pond with a road running past its south shore — the two flat families against each other",
      build(o) {
        const out = [];
        POND_PLAN.forEach((c) => lay(out, c.key, 0, o.oc + c.dc * 3, o.or + c.dr * 3, c.flipped));
        const was = family;
        family = "asphalt";
        for (let i = -1; i < 3; i++) layStraight(out, "col", o.oc - 3 + i * 2, o.or + 5);
        family = was;
        return out;
      },
    },
    {
      id: "tile", label: "Tile out 3x3", any: true,
      hint: "Eight more copies of the selected piece around it — how one piece's own edges are checked",
      build() {
        const p = placed.find((q) => q.id === sel);
        if (!p) return [];
        const fp = footOf(p), out = [];
        for (let dc = -1; dc <= 1; dc++) {
          for (let dr = -1; dr <= 1; dr++) {
            if (!dc && !dr) continue;
            lay(out, p.key, p.vi, p.oc + dc * fp.w, p.or + dr * fp.h, p.flipped);
          }
        }
        return out;
      },
    },
    {
      id: "surround", label: "Surround", any: true,
      hint: "A road straight on all four sides of the selection — a probe for a piece whose arms you do not know yet",
      build() {
        const p = placed.find((q) => q.id === sel);
        if (!p) return [];
        const was = family;
        family = famOf(p.key) === "stone" ? "stone" : "asphalt";
        const fp = footOf(p), out = [];
        ["E", "W", "N", "S"].forEach((arm) =>
          layArm(out, arm, p.oc, p.or, arm === "E" || arm === "W" ? fp.w : fp.h));
        family = was;
        return out;
      },
    },
  ];

  function runPreset(preset) {
    const laid = preset.build(dropOrigin());
    if (!laid.length) return flash("select a piece first", true);
    pushUndo();
    placed.push(...laid);
    // Select the piece the preset is ABOUT, so the inspector opens on the thing being
    // judged rather than on whichever straight happened to be laid first.
    const centre = laid.find((x) => x.key === "pond7" || x.key === (fam().bend || "")
      || x.key === (fam().cross || "")) || laid[0];
    sel = centre.id;
    after();
  }

  function rebuildPresets() {
    const host = $("#presetRow");
    host.innerHTML = "";
    PRESETS.forEach((p) => {
      if (p.pond && family !== "pond") return;
      if (!p.pond && !p.any && family === "pond") return;
      const b = document.createElement("button");
      b.className = "mini"; b.textContent = p.label; b.title = p.hint;
      b.addEventListener("click", () => runPreset(p));
      host.appendChild(b);
    });
  }

  function rebuildFamily() {
    const el = $("#family");
    el.innerHTML = "";
    Object.entries(FAMILIES).forEach(([k, f]) => {
      const o = document.createElement("option");
      o.value = k; o.textContent = f.label;
      el.appendChild(o);
    });
    el.value = family;
  }

  // ---- export ------------------------------------------------------------------
  function exportText() {
    const keys = Object.keys(edits).sort();
    if (!keys.length) {
      return "# Nothing measured yet.\n#\n"
        + "# Drag a piece's art (Alt-drag, or the Anchor mode) until its kerb meets\n"
        + "# its neighbour's, and the anchor you land on prints here, ready to paste\n"
        + "# into ANCHOR_OVERRIDES in tools/prep_placeables.py.";
    }
    const body = keys.map((t) => {
      const e = edits[t];
      const parts = [];
      if (e.anchorX !== undefined) parts.push(`"anchorX": ${e.anchorX}`);
      if (e.anchorY !== undefined) parts.push(`"anchorY": ${e.anchorY}`);
      if (e.dc) parts.push(`"dc": ${e.dc}`);
      if (e.dr) parts.push(`"dr": ${e.dr}`);
      return `    # measured in tools/tile_lab.html — say against what\n    "${t}": {${parts.join(", ")}},`;
    }).join("\n");
    return "# paste into ANCHOR_OVERRIDES in tools/prep_placeables.py,\n"
      + "# then: python tools/prep_placeables.py\nANCHOR_OVERRIDES = {\n" + body + "\n}";
  }
  /** Save / load the measured anchors on their own, so a bench can be handed to
   *  somebody else and their numbers can be read back in and compared. Only tiles this
   *  build knows about are accepted — a file from a newer catalog says so rather than
   *  silently dropping half its entries. */
  function saveAnchors() {
    const blob = new Blob([JSON.stringify(edits, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "anchors.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("saved anchors.json");
  }
  function loadAnchors(text) {
    let incoming;
    try { incoming = JSON.parse(text); } catch (e) { return flash("bad JSON: " + e.message, true); }
    if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) return flash("not an anchor file", true);
    const known = new Set(pieces.flatMap((p) => p.variants).map((v) => v.tile));
    const num = (v) => typeof v === "number" && isFinite(v);
    let applied = 0; const skipped = [];
    pushUndo();
    Object.keys(incoming).forEach((tile) => {
      if (!known.has(tile)) return skipped.push(tile);
      const e = incoming[tile] || {};
      const patch = {};
      ["anchorX", "anchorY", "dc", "dr"].forEach((k) => { if (num(e[k])) patch[k] = e[k]; });
      if (!Object.keys(patch).length) return skipped.push(tile);
      setEdit(tile, patch);
      applied++;
    });
    after();
    flash(`loaded ${applied} tile${applied === 1 ? "" : "s"}`
      + (skipped.length ? ` · ignored ${skipped.join(", ")}` : ""), !applied);
  }

  /** Copy, on a page that is usually opened from the filesystem. `navigator.clipboard`
   *  needs a secure context and is simply missing in some browsers on a file:// URL, so
   *  fall back to the old selection trick before giving up — and if even that fails, say
   *  so, because the text is right there in the box to be copied by hand. */
  function copy(txt) {
    const ok = () => flash("copied");
    const manual = () => {
      const box = $("#export");
      box.focus(); box.select();
      let done = false;
      try { done = document.execCommand("copy"); } catch (_) { done = false; }
      done ? ok() : flash("couldn't copy — the text is selected, press Ctrl+C", true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, manual);
    } else {
      manual();
    }
  }
  function flash(msg, bad) {
    const el = $("#armed");
    const was = el.textContent;
    el.textContent = msg;
    el.style.color = bad ? "var(--danger)" : "var(--accent2)";
    setTimeout(() => { el.textContent = was; el.style.color = ""; }, 1400);
  }

  // ---- persistence -------------------------------------------------------------
  const STORE = "zftilelab:v1";
  function store() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ placed, edits, view, nextId }));
      flash("bench stored");
    } catch (_) { flash("could not store", true); }
  }
  function loadStored() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return false;
      const s = JSON.parse(raw);
      // Drop anything whose art is no longer in the build, so a regenerated catalog
      // cannot resurrect a piece that does not exist.
      placed = (s.placed || []).filter((o) => byKey.has(o.key) && byKey.get(o.key).variants[o.vi]);
      // An edit that now MATCHES what shipped is not an edit: a measurement that has
      // since been applied to prep_placeables and rebuilt into this page would
      // otherwise keep printing itself as an override and showing a delta of zero as
      // if it were pending. Re-running each through setEdit prunes exactly those.
      edits = {};
      Object.entries(s.edits || {}).forEach(([tile, patch]) => setEdit(tile, patch));
      nextId = s.nextId || (placed.reduce((m, o) => Math.max(m, o.id), 0) + 1);
      if (s.view) Object.assign(view, s.view);
      return true;
    } catch (_) { return false; }
  }

  // ---- wiring ------------------------------------------------------------------
  function syncModeButtons() {
    ["place", "select", "anchor"].forEach((m) => {
      const b = document.querySelector(`[data-mode="${m}"]`);
      b.classList.toggle("on", mode === m);
    });
    canvas.style.cursor = mode === "anchor" ? "move" : mode === "place" ? "crosshair" : "default";
  }
  function after() {
    rebuildPalette(); rebuildLaid(); rebuildInspector();
    $("#export").value = exportText();
    $("#btnUndo").disabled = !undoStack.length;
    $("#btnRedo").disabled = !redoStack.length;
    draw();
  }

  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    mode = b.dataset.mode; syncModeButtons(); draw();
  }));
  $("#zoom").addEventListener("input", (e) => {
    const [cw, ch] = cssSize();
    const [wx, wy] = s2w(cw / 2, ch / 2);
    view.zoom = +e.target.value;
    view.ox = cw / 2 - wx * view.zoom;
    view.oy = ch / 2 - wy * view.zoom;
    draw();
  });
  ["#ckGrid", "#ckFoot", "#ckPins", "#ckTint", "#ckGhost"].forEach((s) =>
    $(s).addEventListener("change", draw));
  $("#filter").addEventListener("input", rebuildPalette);
  $("#btnFit").addEventListener("click", fitView);
  $("#btnUndo").addEventListener("click", undo);
  $("#btnRedo").addEventListener("click", redo);
  $("#btnClear").addEventListener("click", () => { pushUndo(); placed = []; sel = null; after(); });
  $("#btnStore").addEventListener("click", store);
  $("#family").addEventListener("change", (e) => { family = e.target.value; rebuildPresets(); });
  $("#btnCopyPy").addEventListener("click", () => { $("#export").value = exportText(); copy(exportText()); });
  $("#btnSave").addEventListener("click", saveAnchors);
  $("#btnLoad").addEventListener("click", () => $("#fileAnchors").click());
  $("#fileAnchors").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => loadAnchors(rd.result);
    rd.readAsText(f);
    e.target.value = ""; // so the same file can be loaded twice
  });
  window.addEventListener("resize", resize);

  $("#tip").innerHTML = "<kbd>click</kbd> place · <kbd>drag</kbd> move a tile at a time · "
    + "<kbd>Alt+drag</kbd> slide the art · <kbd>←→↑↓</kbd> nudge 1px "
    + "(<kbd>Shift</kbd> ×10, <kbd>Ctrl</kbd> a tile) · <kbd>F</kbd> mirror · "
    + "<kbd>Del</kbd> remove · <kbd>Shift+drag</kbd>/<kbd>wheel</kbd> pan &amp; zoom";

  loadImages(() => {
    const had = loadStored();
    syncModeButtons();
    rebuildFamily();
    rebuildPresets();
    resize();
    if (!had) {
      // Open on something worth looking at: a straight, so the grid has a scale.
      const first = byKey.get("roadStraight") || pieces[0];
      if (first) { armed = { key: first.key, vi: 0 }; $("#armed").textContent = first.name + " #0"; }
    }
    after();
    fitView();
  });
})();
</script>
